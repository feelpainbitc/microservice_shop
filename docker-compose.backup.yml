services:
  users-db:
    image: postgres:17
    container_name: microservices-users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users_password
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data

  catalog-db:
    image: postgres:17
    container_name: microservices-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog_password
      POSTGRES_DB: catalog_db
    ports:
      - "5434:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data

  orders-db:
    image: postgres:17
    container_name: microservices-orders-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders_password
      POSTGRES_DB: orders_db
    ports:
      - "5435:5432"
    volumes:
      - orders_db_data:/var/lib/postgresql/data

volumes:
  users_db_data:
  catalog_db_data:
  orders_db_data:
